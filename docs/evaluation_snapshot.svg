<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Evaluation output snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #f9fafb; }
      .sub { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; letter-spacing: 0.06em; }
      .mono { font: 600 18px 'Consolas', 'Courier New', monospace; fill: #e2e8f0; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .cell { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .ok { fill: #22c55e; }
      .line { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="612" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <text x="92" y="112" class="title">Evaluation Output Snapshot</text>
  <text x="92" y="145" class="sub">Deterministic run summary with replay validation and benchmark coverage</text>

  <rect x="90" y="190" width="360" height="112" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="118" y="228" class="label">QUERY BATCH</text>
  <text x="118" y="262" class="mono">40 queries evaluated</text>
  <text x="118" y="288" class="small">normal, ambiguous, adversarial, contradiction-prone, provenance-sensitive</text>

  <rect x="474" y="190" width="300" height="112" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="502" y="228" class="label">REPLAY</text>
  <text x="502" y="262" class="mono ok">validated</text>
  <text x="502" y="288" class="small">trace integrity verified</text>

  <rect x="798" y="190" width="248" height="112" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="826" y="228" class="label">PROVENANCE</text>
  <text x="826" y="262" class="mono">100%</text>
  <text x="826" y="288" class="small">coverage</text>

  <rect x="90" y="340" width="956" height="240" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="118" y="378" class="label">SUMMARY.JSON</text>
  <line x1="118" y1="396" x2="1018" y2="396" class="line"/>
  <text x="118" y="436" class="cell">Queries Evaluated</text>
  <text x="900" y="436" class="cell" text-anchor="end">40</text>
  <text x="118" y="474" class="cell">Replay Validation</text>
  <text x="900" y="474" class="cell" text-anchor="end">Pass</text>
  <text x="118" y="512" class="cell">Tests Passing</text>
  <text x="900" y="512" class="cell" text-anchor="end">81</text>
  <text x="118" y="550" class="cell">Deterministic Replay</text>
  <text x="900" y="550" class="cell" text-anchor="end">Verified</text>

  <text x="92" y="642" class="small">This snapshot mirrors the curated demo artifacts in results/demo_run/.</text>
</svg>
